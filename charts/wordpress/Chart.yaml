apiVersion: v2
name: wordpress
description: >-
  Using the official WordPress image. This chart provides automation for
  installation, user management, plugin installation, and metrics.
type: application
version: 5.5.53
appVersion: 7.0.1
icon: >-
  https://raw.githubusercontent.com/slydlake/helm-charts/refs/heads/main/charts/wordpress/app.png
home: https://github.com/slydlake/helm-charts
maintainers:
  - name: slydlake
sources:
  - https://github.com/slydlake/helm-charts
annotations:
  artifacthub.io/category: networking
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: SlyCharts GitHub Repository
      url: https://github.com/slydlake/helm-charts/tree/main/charts/wordpress
    - name: Official WordPress Repository
      url: https://github.com/docker-library/
    - name: "SlyMetrics WordPress plugin for Prometheus Metrics"
      url: https://github.com/slydlake/slymetrics
    - name: Apache Metrics container
      url: https://github.com/Lusitaniae/apache_exporter
  artifacthub.io/maintainers: |
    - name: slydlake
      email: sly.dlake@gmail.com
  artifacthub.io/changes: |
    - kind: fixed
      description: "deps: update docker.io/wordpress:7.1.3-php8.3-apache docker digest to e4447d6"
      links:
        - name: GitHub
          url: https://github.com/SlyBase/helm-charts/commit/84e28f62a23b0dbb1c9aaa4729712a9e8f9bcc55
    - kind: fixed
      description: "deps: update mariadb docker tag to v0.16.17"
      links:
        - name: GitHub
          url: https://github.com/SlyBase/helm-charts/commit/bf6285bfd79b2c1cd30312934b1f04c5b4a1cbc3
    - kind: fixed
      description: "deps: update redis docker tag to v0.37.5"
      links:
        - name: GitHub
          url: https://github.com/SlyBase/helm-charts/commit/c3a96ce4a43df05416b7421c4870d4d284e1ea09
  artifacthub.io/images: |
    - name: wordpress
      image: docker.io/wordpress:7.1.3-php8.3-apache
    - name: wordpress-cli
      image: docker.io/wordpress:cli-2.12.0-php8.3
    - name: metrics-apache
      image: docker.io/lusotycoon/apache-exporter:v1.1.1
    - name: mariadb
      image: docker.io/mariadb:12.3.3-noble
    - name: memcached
      image: docker.io/memcached:1.6.45
    - name: redis
      image: docker.io/redis:8.10.2-trixie
    - name: valkey
      image: docker.io/valkey/valkey:9.1.2-trixie
dependencies:
  - condition: memcached.enabled
    name: memcached
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.14.13
  - condition: redis.enabled
    name: redis
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.37.5
  - condition: valkey.enabled
    name: valkey
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.25.13
  - condition: mariadb.enabled
    name: mariadb
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.16.17
keywords:
  - wordpress
  - blog
